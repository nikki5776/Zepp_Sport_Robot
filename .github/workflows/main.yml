name: 自动任务-修改Zepp当天运动数据

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: '检出仓库代码'
        uses: actions/checkout@v6
      - name: '设置 Python 环境'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.0'
      - name: '安装依赖项'
        run: pip install requests==2.26.0
      - name: '运行主程序'
        env:
          ACCOUNT_1: ${{ secrets.ACCOUNT_1 }}
          PASSWORD_1: ${{ secrets.PASSWORD_1 }}
          ACCOUNT_2: ${{ secrets.ACCOUNT_2 }}
          PASSWORD_2: ${{ secrets.PASSWORD_2 }}
        run: python ./main.py
